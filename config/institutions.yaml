# ============================================================
# 监督机构数据库
# ============================================================
# 字段说明:
#   - name       机构名称
#   - type       hotline / email / online / address
#   - scope      适用范围（如 全国 / China / USA / EU / global）
#   - region     地区（可空）
#   - description 简介
#   - contact    电话（若有）
#   - email      邮箱（若有）
#   - url        网址（若有）
#
# 邮箱均来自各机构官网或公开材料，如发生变更请通过 PR 更新。
# ============================================================

