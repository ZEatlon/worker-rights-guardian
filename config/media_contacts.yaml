# ============================================================
# 媒体联系方式数据库
# ============================================================
# 用于 `--media` 选项时显示给用户参考。
# 字段说明:
#   - name     媒体名称
#   - type     类型: newspaper / tv / radio / magazine / online
#   - region   国家 / 地区
#   - email    举报 / 线索邮箱(若有)
#   - url      网址
#   - contact  电话
#   - description 简介
# 邮箱与联系方式均来自各媒体官网或公开渠道,如有变更请通过 PR 更新。
# ============================================================

china_media:
  - name: "新华社新闻线索"
    type: "online"
    region: "中国"
    url: "https://www.news.cn/"
    description: "国家通讯社,可关注重大劳动权益事件"
  - name: "央视新闻线索"
    type: "tv"
    region: "中国"
    url: "https://news.cctv.com/"
    description: "中央电视台新闻频道"
  - name: "澎湃新闻 - 投诉湃"
    type: "online"
    region: "中国"
    url: "https://www.thepaper.cn/"
    description: "澎湃新闻,设有消费维权与投诉报道栏目"
  - name: "界面新闻"
    type: "online"
    region: "中国"
    url: "https://www.jiemian.com/"
    description: "聚焦财经新闻,常报道劳资议题"
  - name: "财新网"
    type: "online"
    region: "中国"
    url: "https://www.caixin.com/"
    description: "深度报道劳工权益议题"
  - name: "南方周末"
    type: "newspaper"
    region: "中国"
    url: "https://www.infzm.com/"
    description: "深度调查报道"

